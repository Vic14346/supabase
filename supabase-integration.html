<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velectron Supabase Integration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Velectron Supabase Integration</h1>
    <div id="status"></div>

    <script>
        // Wait for Supabase library to load
        setTimeout(async function() {
            try {
                const SUPABASE_URL = "https://gyaayoiubitxixevvzut.supabase.co";
                const SUPABASE_KEY = "sb_publishable_z6fbIppsOlrljaecVuCI_w_6xdhGFM3";

                // Initialize Supabase - CORRECT WAY
                const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                // Test connection
                const { data, error } = await supabaseClient.from('games').select('count');
                
                if (error) throw error;

                document.getElementById('status').innerHTML = `
                    <h2 style="color: green;">✅ SUPABASE CONNECTION SUCCESSFUL</h2>
                    <p>✅ Games table connected</p>
                `;

                console.log('✅ Supabase connected successfully');

            } catch (error) {
                document.getElementById('status').innerHTML = `
                    <h2 style="color: red;">❌ CONNECTION FAILED</h2>
                    <p>Error: ${error.message}</p>
                `;
                console.error('❌ Error:', error);
            }
        }, 1000);
    </script>
</body>
</html>
