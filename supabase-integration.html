<script>
    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================
    const SUPABASE_URL = "https://gyaayoiubitxixevvzut.supabase.co";
    const SUPABASE_KEY = "sb_publishable_z6fbIppsOlrljaecVuCI_w_6xdhGFM3";

    // Initialize Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================
    // TEST CONNECTION
    // ============================================
    async function testSupabaseConnection() {
        try {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>Testing Supabase connection...</p>';

            const { data, error } = await supabase.from('games').select('count');
            
            if (error) throw error;

            statusDiv.innerHTML = `
                <h2 style="color: green;">✅ SUPABASE CONNECTION SUCCESSFUL</h2>
                <p>Games table: Connected</p>
            `;

            console.log('✅ Supabase connected successfully');
            return true;

        } catch (error) {
            document.getElementById('status').innerHTML = `
                <h2 style="color: red;">❌ CONNECTION FAILED</h2>
                <p>Error: ${error.message}</p>
            `;
            console.error('❌ Error:', error);
            return false;
        }
    }

    // Run test when page loads
    window.addEventListener('load', testSupabaseConnection);
</script>
